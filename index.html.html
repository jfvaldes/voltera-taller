// =================== GOOGLE CALENDAR ===================
function makeGCal(p){
  const pad=n=>String(n).padStart(2,"0");
  const f=(p.fecha||hoy()).replace(/-/g,"");
  const [hh,mm]=(p.hora||"09:00").split(":");
  const sh=parseInt(hh),eh=sh+(parseInt(p.duracion)||2);
  const start=`${f}T${pad(sh)}${mm}00`,end=`${f}T${pad(eh)}${mm}00`;
  const title=encodeURIComponent(`🔧 ${p.tipo} — ${p.patente}`);
  const det=encodeURIComponent(`Patente: ${p.patente}\nVIN: ${p.vin||""}\nVehículo: ${p.marca} ${p.modelo} ${p.anio}\nCliente: ${p.cliente}\nTécnico: ${p.tecnico||"Sin asignar"}\nTaller Voltera EV`);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${det}`;
}

        </div>

        </tbody>

    </div>

// =================== TÉCNICOS HH ===================
function Tecnicos({ordenes}){
  const semDias=()=>{const n=new Date(),d=n.getDay(),l=new Date(n);l.setDate(n.getDate()-(d===0?6:d-1));return Array.from({length:6},(_,i)=>{const x=new Date(l);x.setDate(l.getDate()+i);return x.toISOString().slice(0,10);});};
  const dias=semDias();
  const chartRefs=TECNICOS.map(()=>useRef(null));
  const chartInsts=useRef([]);
  useEffect(()=>{
    chartInsts.current.forEach(c=>c?.destroy());chartInsts.current=[];
    TECNICOS.forEach((tec,i)=>{
      if(!chartRefs[i].current)return;
      const hhDia=dias.map(d=>ordenes.filter(o=>o.tecnico===tec&&o.fecha===d).reduce((s,o)=>s+(parseFloat(o.horasHombre)||0),0));
      const c=new Chart(chartRefs[i].current,{type:"bar",data:{labels:["Lun","Mar","Mié","Jue","Vie","Sáb"],datasets:[{label:"HH trabajadas",data:hhDia,backgroundColor:"rgba(30,136,229,.8)",borderRadius:4,borderSkipped:false},{label:"HH disponibles",data:hhDia.map(h=>Math.max(0,8-h)),backgroundColor:"rgba(200,230,255,.5)",borderRadius:4,borderSkipped:false}]},options:{plugins:{legend:{display:true,position:"top",labels:{font:{size:10}}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,max:8,grid:{color:"#f0f2f5"},title:{display:true,text:"Hrs/día"}}}}});
      chartInsts.current.push(c);
    });
    return()=>chartInsts.current.forEach(c=>c?.destroy());
  },[ordenes]);
  return(<div>
    <div className="pgt">Gestión de técnicos</div>
    <div className="pgs">Holgura y utilización de horas hombre</div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:14}}>
      {TECNICOS.map((tec,i)=>{
        const u=ordenes.filter(o=>o.tecnico===tec&&dias.includes(o.fecha)).reduce((s,o)=>s+(parseFloat(o.horasHombre)||0),0);
        const pct=Math.round((u/HH_SEMANA)*100);const clr=pct>=90?"#C62828":pct>=70?"#F57F17":"#1E88E5";
        return(<div key={tec} className="cw">
          <div className="ct">{tec}</div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6}}><span style={{color:"#888"}}>HH usadas</span><span style={{fontWeight:700,color:clr}}>{u.toFixed(1)} / {HH_SEMANA} ({pct}%)</span></div>
          <div style={{background:"#f0f2f5",borderRadius:8,height:9,marginBottom:12,overflow:"hidden"}}><div style={{width:`${Math.min(100,pct)}%`,height:"100%",background:clr,borderRadius:8}}/></div>
          <canvas ref={chartRefs[i]} height={150}/>
        </div>);
      })}
    </div>
  </div>);
}

        </div>

      <div className="pdoc-section">

        {mants.length>0?(<table style={{fontSize:12,width:"100%",borderCollapse:"collapse"}}>

// =================== MÓDULO FLOTA LEASING ===================
function FlotaLeasing({flota, setFlota}){
  const [show,setShow] = useState(false);
  const [editContrato,setEditContrato] = useState(null);
  const [docContrato,setDocContrato] = useState(null);
  const [search,setSearch] = useState("");
  const [filtEst,setFiltEst] = useState("Todos");
  const [vistaDetalle,setVistaDetalle] = useState(null);
  const chartRef = useRef(null); const chartInst = useRef(null);

  const guardar = (form) => {
    if(!form.patente||!form.cliente) return alert("Completa patente y cliente");
    const item = {...form, id: editContrato?.id||Date.now()};
    if(editContrato) setFlota(f=>f.map(x=>x.id===item.id?item:x));
    else setFlota(f=>[...f,item]);
    setShow(false); setEditContrato(null);
  };
  const eliminar = id => { if(window.confirm("¿Eliminar este contrato?")) setFlota(f=>f.filter(x=>x.id!==id)); };

  // Métricas globales
  const activos = flota.filter(f=>f.estadoContrato==="Activo");
  const ingMensual = activos.reduce((s,f)=>s+(f.cuotaMensual||0),0);
  const facAcum = flota.reduce((s,f)=>s+(f.cuotasFact||0)*(f.cuotaMensual||0),0);
  const vencen60 = flota.filter(f=>{ const d=diasRestantes(f.fechaFin); return d!==null&&d>=0&&d<=60; }).length;

  // Filtros
  const fil = flota.filter(f=>{
    const txt = search.toLowerCase();
    const matchSearch = !txt || f.patente?.toLowerCase().includes(txt)||f.cliente?.toLowerCase().includes(txt)||f.faena?.toLowerCase().includes(txt)||f.vin?.toLowerCase().includes(txt);
    const matchEst = filtEst==="Todos" || f.estadoContrato===filtEst;
    return matchSearch && matchEst;
  });

  // Gráfico donut por cliente
  useEffect(()=>{
    if(chartInst.current) chartInst.current.destroy();
    if(!chartRef.current||!activos.length) return;
    const byCliente = {};
    activos.forEach(f=>{ byCliente[f.cliente]=(byCliente[f.cliente]||0)+1; });
    const labels = Object.keys(byCliente);
    const data = labels.map(l=>byCliente[l]);
    const colors = ["#1E88E5","#0C2D6B","#2E7D32","#F57F17","#C62828","#7B1FA2","#00695C","#4527A0"];
    chartInst.current = new Chart(chartRef.current,{type:"doughnut",data:{labels,datasets:[{data,backgroundColor:colors.slice(0,labels.length),borderWidth:2,borderColor:"#fff"}]},options:{plugins:{legend:{position:"right",labels:{font:{size:11},boxWidth:12}}},cutout:"60%"}});
    return()=>chartInst.current?.destroy();
  },[flota]);

  const contColor = e => e==="Activo"?"green":e==="Vencido"?"red":e==="Pausado"?"amber":e==="En negociación"?"blue":"gray";

  // Vista detalle de unidad
  if(vistaDetalle){
    const c = flota.find(f=>f.id===vistaDetalle);
    if(!c){setVistaDetalle(null);return null;}
    const pct = c.cuotasTotales>0?Math.round((c.cuotasFact/c.cuotasTotales)*100):0;
    const mants=(c.mantenciones||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const costoVoltera=mants.filter(m=>m.lugar?.toLowerCase().includes("voltera")).reduce((s,m)=>s+(m.costo||0),0);
    const costoExt=mants.filter(m=>!m.lugar?.toLowerCase().includes("voltera")).reduce((s,m)=>s+(m.costo||0),0);
    return(<div>
      <button onClick={()=>setVistaDetalle(null)} className="bs2 bsm" style={{marginBottom:12}}>← Volver a flota</button>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <div style={{fontSize:28,fontWeight:800,color:"#0C2D6B",letterSpacing:".04em"}}>{c.patente}</div>
        <Badge label={c.estadoContrato} color={contColor(c.estadoContrato)}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:500}}>{c.marca} {c.modelo} {c.tipo} {c.anio}</div>
          <div style={{fontSize:12,color:"#888"}}>{c.cliente} · {c.faena||"Sin faena"}</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button className="bprint bsm" onClick={()=>setDocContrato(c)}>🖨 Estado cuenta</button>
          <button className="bsm" onClick={()=>{setEditContrato(c);setShow(true);}}>Editar</button>
        </div>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
        <div className="fl-kpi"><div className="fl-kpi-val">{c.cuotasFact}</div><div className="fl-kpi-lbl">Cuotas facturadas</div></div>
        <div className="fl-kpi"><div className="fl-kpi-val">{c.cuotasTotales}</div><div className="fl-kpi-lbl">Cuotas totales</div></div>
        <div className={`fl-kpi${vencen60>0?" fl-kpi-warn":""}`}><div className="fl-kpi-val">{diasRestEl(diasRestantes(c.fechaFin))}</div><div className="fl-kpi-lbl">Al vencimiento</div></div>
        <div className="fl-kpi"><div className="fl-kpi-val">{mants.length}</div><div className="fl-kpi-lbl">Mantenciones</div></div>
        <div className="fl-kpi"><div className="fl-kpi-val" style={{fontSize:15}}>{clp(costoVoltera+costoExt)}</div><div className="fl-kpi-lbl">Costo total mant.</div></div>
        <div className="fl-kpi"><div className="fl-kpi-val" style={{fontSize:15}}>{clp(c.cuotasFact*c.cuotaMensual)}</div><div className="fl-kpi-lbl">Facturado acum.</div></div>
      </div>
      <div style={{marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#888",marginBottom:4}}>
          <span>Avance contrato</span><span style={{fontWeight:700,color:"#0C2D6B"}}>{pct}% — {c.cuotasFact}/{c.cuotasTotales} cuotas</span>
        </div>
        <div className="fl-progress-bar" style={{height:12}}><div className="fl-progress-fill" style={{width:`${Math.min(100,pct)}%`,background:pct>=100?"#C62828":"#1E88E5"}}/></div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#aaa",marginTop:3}}>
          <span>{c.fechaInicio||"—"}</span><span>{c.fechaFin||"—"}</span>
        </div>
      </div>
      <div className="cw">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div className="ct" style={{marginBottom:0}}>Historial de mantención</div>
          <div style={{display:"flex",gap:8,fontSize:12}}>
            <span style={{color:"#1565C0"}}>🔵 Voltera {clp(costoVoltera)}</span>
            <span style={{color:"#7B1FA2"}}>🟣 Externo {clp(costoExt)}</span>
          </div>
        </div>
        <div className="fl-timeline">
          {mants.map(m=>{
            const esV=m.lugar?.toLowerCase().includes("voltera");
            return(<div key={m.id} className="fl-tl-item">
              <div className={`fl-tl-dot${esV?"":" fl-tl-dot-ext"}`}/>
              <div style={{flex:1}}>
                <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
                  <span style={{fontWeight:600}}>{m.tipo} <span style={{fontSize:11,color:esV?"#1565C0":"#7B1FA2",fontWeight:500}}>{esV?"🔵 Voltera":"🟣 Externo"}</span></span>
                  <div style={{display:"flex",gap:8,fontSize:11,color:"#aaa"}}>
                    <span>{m.fecha}</span>
                    {m.costo>0&&<span style={{fontWeight:700,color:"#0C2D6B"}}>{clp(m.costo)}</span>}
                  </div>
                </div>
                <div style={{fontSize:12,color:"#888"}}>{m.lugar}{m.km?` · ${parseInt(m.km).toLocaleString("es-CL")} km`:""}</div>
                {m.descripcion&&<div style={{fontSize:12,color:"#666",fontStyle:"italic"}}>{m.descripcion}</div>}
              </div>
            </div>);
          })}
          {!mants.length&&<p style={{color:"#aaa",fontSize:13}}>Sin registros de mantención.</p>}
        </div>
      </div>
      {docContrato&&<DocFlota contrato={docContrato} onClose={()=>setDocContrato(null)}/>}
    </div>);
  }

  // Vista lista
  return(<div>
    <div className="pgt">Flota — Leasing operativo</div>
    <div className="pgs">Gestión de contratos, historial de mantención y estado de cuenta por unidad</div>
    <div className="mgrid" style={{gridTemplateColumns:"repeat(4,1fr)",marginBottom:20}}>
      <div className="mt mb2"><div className="ml">Unidades activas</div><div className="mv">{activos.length}</div></div>
      <div className="mt mg2"><div className="ml">Ingreso mensual neto</div><div className="mv" style={{fontSize:15}}>{clp(ingMensual)}</div></div>
      <div className="mt" style={{borderTop:"3px solid #0C2D6B"}}><div className="ml">Facturado acumulado</div><div className="mv" style={{fontSize:15}}>{clp(facAcum)}</div></div>
      <div className={`mt ${vencen60>0?"mr2":"mg2"}`}><div className="ml">Vencen en 60 días</div><div className="mv" style={{color:vencen60>0?"#C62828":undefined}}>{vencen60}</div></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:16,marginBottom:16,alignItems:"start"}}>
      <div className="cw" style={{padding:"14px 16px"}}>
        <div className="ct">Distribución por cliente (unidades activas)</div>
        <canvas ref={chartRef} height={150}/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {ESTADOS_CONTRATO.map(e=>{const n=flota.filter(f=>f.estadoContrato===e).length;return(<div key={e} style={{display:"flex",alignItems:"center",gap:8,fontSize:13}}><Badge label={e} color={contColor(e)}/><span style={{color:"#888"}}>{n} unidad{n!==1?"es":""}</span></div>);})}
      </div>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
      <input placeholder="Buscar patente, cliente, faena, VIN..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:160}}/>
      <select value={filtEst} onChange={e=>setFiltEst(e.target.value)} style={{width:"auto"}}>
        <option value="Todos">Todos los estados</option>
        {ESTADOS_CONTRATO.map(e=><option key={e}>{e}</option>)}
      </select>
      <button className="bp" onClick={()=>{setEditContrato(null);setShow(true);}}>+ Nueva unidad</button>
    </div>
    {!fil.length&&<p style={{color:"#aaa",fontSize:13}}>Sin contratos registrados.</p>}
    {fil.map(c=>{
      const pct=c.cuotasTotales>0?Math.round((c.cuotasFact/c.cuotasTotales)*100):0;
      const dias=diasRestantes(c.fechaFin);
      const mants=c.mantenciones||[];
      const lastM=mants.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
      return(<div key={c.id} className="fl-card">
        <div className="fl-card-header">
          <div style={{width:50,height:50,borderRadius:10,background:"#EBF2FF",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer"}} onClick={()=>setVistaDetalle(c.id)}>
            <span style={{fontSize:11,fontWeight:800,color:"#0C2D6B"}}>{c.patente?.slice(0,2)||"EV"}</span>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:2}}>
              <span className="fl-patente" style={{cursor:"pointer"}} onClick={()=>setVistaDetalle(c.id)}>{c.patente}</span>
              <Badge label={c.estadoContrato} color={contColor(c.estadoContrato)}/>
              <Badge label={c.financiador} color="purple"/>
            </div>
            <div style={{fontSize:13,color:"#444"}}>{c.marca} {c.modelo} {c.tipo} {c.anio} · {c.color||""}</div>
            <div style={{fontSize:12,color:"#888"}}>{c.cliente} · <span style={{color:"#1565C0"}}>{c.faena||"Sin faena asignada"}</span></div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontWeight:700,fontSize:17,color:"#0C2D6B"}}>{clp(c.cuotaMensual)}<span style={{fontSize:11,fontWeight:400,color:"#888"}}>/mes</span></div>
            <div style={{fontSize:11,color:"#888",marginTop:2}}>Venc: {diasRestEl(dias)}</div>
          </div>
        </div>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#aaa",marginBottom:3}}>
            <span>Cuotas: {c.cuotasFact}/{c.cuotasTotales}</span>
            <span>{pct}%</span>
          </div>
          <div className="fl-progress-bar"><div className="fl-progress-fill" style={{width:`${Math.min(100,pct)}%`,background:pct>=100?"#C62828":"#1E88E5"}}/></div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,flexWrap:"wrap",gap:6}}>
          <div style={{fontSize:11,color:"#aaa"}}>
            {mants.length} mantención{mants.length!==1?"es":""}
            {lastM&&<span> · Última: {lastM.fecha} {lastM.lugar?.toLowerCase().includes("voltera")?"🔵":"🟣"}</span>}
          </div>
          <div style={{display:"flex",gap:6}}>
            <button className="bsm bs2" onClick={()=>setVistaDetalle(c.id)}>Ver detalle</button>
            <button className="bsm bprint" onClick={()=>setDocContrato(c)} style={{fontSize:11}}>🖨</button>
            <button className="bsm" onClick={()=>{setEditContrato(c);setShow(true);}}>Editar</button>
            <button className="bsm bd2" onClick={()=>eliminar(c.id)}>Eliminar</button>
          </div>
        </div>
      </div>);
    })}
    {show&&<ModalContrato contrato={editContrato} onSave={guardar} onClose={()=>{setShow(false);setEditContrato(null);}} recepciones={[]}/>}
    {docContrato&&<DocFlota contrato={docContrato} onClose={()=>setDocContrato(null)}/>}
  </div>);
}

function Login({onLogin}){
  const [u,setU]=useState("");const [p,setP]=useState("");const [err,setErr]=useState("");
  const login=()=>{const f=USUARIOS.find(x=>x.user===u.trim()&&x.pass===p);if(f){setErr("");onLogin(f);}else setErr("Usuario o contraseña incorrectos");};
  return(<div className="lwrap">
    <div className="lbox">
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24,justifyContent:"center"}}>
        <div className="lm">V</div>
        <div><div style={{fontSize:22,fontWeight:700,color:"#0C2D6B"}}>Voltera</div><div style={{fontSize:13,color:"#888"}}>Taller EV</div></div>
      </div>
      {err&&<div className="lerr">⚠ {err}</div>}
      <div className="fl"><label>Usuario</label><input value={u} onChange={e=>setU(e.target.value)} placeholder="ej. admin" onKeyDown={e=>e.key==="Enter"&&login()}/></div>
      <div className="fl"><label>Contraseña</label><input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()}/></div>
      <button className="bp" onClick={login} style={{width:"100%",marginTop:8,padding:"10px"}}>Ingresar</button>
      <p style={{fontSize:11,color:"#ccc",textAlign:"center",marginTop:14}}>Solo personal Voltera autorizado</p>
    </div>
  </div>);
}

// =================== APP PRINCIPAL ===================
function App(){
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState(null);
  const [recepciones,setRecepciones]=useState([]);
  const [programacion,setProgramacion]=useState([]);
  const [ordenes,setOrdenes]=useState([]);
  const [stock,setStock]=useState(STOCK_INI);
  const [flota,setFlota]=useState([]);
  const [sync,setSync]=useState("loading");
  const [lastSync,setLastSync]=useState("");
  const init=useRef(false);const stT=useRef({});

  // Recuperar sesión
  useEffect(()=>{try{const s=sessionStorage.getItem("vt_user");if(s){const u=JSON.parse(s);setUser(u);}}catch{};},[]);

  useEffect(()=>{
    if(!user)return;
    (async()=>{setSync("loading");const [r,p,o,s,fl]=await Promise.all([sbGet("recepciones"),sbGet("programacion"),sbGet("ordenes"),sbGet("stock"),sbGet("flota")]);if(r)setRecepciones(r);if(p)setProgramacion(p);if(o)setOrdenes(o);if(s)setStock(s);if(fl)setFlota(fl);setSync("ok");setLastSync(new Date().toLocaleTimeString("es-CL"));init.current=true;})();
  },[user]);

  useEffect(()=>{if(!user)return;const iv=setInterval(async()=>{if(!init.current)return;const [r,p,o,s,fl]=await Promise.all([sbGet("recepciones"),sbGet("programacion"),sbGet("ordenes"),sbGet("stock"),sbGet("flota")]);if(r)setRecepciones(r);if(p)setProgramacion(p);if(o)setOrdenes(o);if(s)setStock(s);if(fl)setFlota(fl);setLastSync(new Date().toLocaleTimeString("es-CL"));},30000);return()=>clearInterval(iv);},[user]);

  const save=useCallback((tabla,data)=>{if(!init.current)return;setSync("saving");clearTimeout(stT.current[tabla]);stT.current[tabla]=setTimeout(async()=>{const ok=await sbSet(tabla,data);setSync(ok?"ok":"error");if(ok)setLastSync(new Date().toLocaleTimeString("es-CL"));},900);},[]);
  useEffect(()=>{save("recepciones",recepciones);},[recepciones]);
  useEffect(()=>{save("programacion",programacion);},[programacion]);
  useEffect(()=>{save("ordenes",ordenes);},[ordenes]);
  useEffect(()=>{save("stock",stock);},[stock]);
  useEffect(()=>{save("flota",flota);},[flota]);

  const onLogin=u=>{setUser(u);try{sessionStorage.setItem("vt_user",JSON.stringify(u));}catch{};};
  const onLogout=()=>{setUser(null);setTab(null);try{sessionStorage.removeItem("vt_user");}catch{};};
  const doExport=()=>exportarExcel(recepciones,ordenes,stock,programacion);

  if(!user)return <Login onLogin={onLogin}/>;

  const rol=user.rol;
  const esTecnico=rol==="tecnico";
  const esRepuestos=rol==="repuestos";
  const esFlota=rol==="flota";
  const nombreTec=esTecnico?TECNICOS.find(t=>t.toLowerCase().startsWith(user.nombre.split(" ")[0].toLowerCase()))||user.nombre:null;

  // Definir pestañas según rol
  const tabs2=[];
  if(puedeVer(rol,"dashboard"))tabs2.push({id:"dashboard",l:"Dashboard",icon:"📊"});
  if(puedeVer(rol,"recepciones"))tabs2.push({id:"recepciones",l:"Recepciones",icon:"🚗"});
  if(puedeVer(rol,"programacion")||esTecnico)tabs2.push({id:"programacion",l:esTecnico?"Mi agenda":"Programación",icon:"📅"});
  if(puedeVer(rol,"ordenes")||esTecnico)tabs2.push({id:"ordenes",l:esTecnico?"Mis OTs":"Órdenes de Trabajo",icon:"🔧"});
  if(puedeVer(rol,"tecnicos"))tabs2.push({id:"tecnicos",l:"Técnicos",icon:"👷"});
  if(puedeVer(rol,"inventario_taller"))tabs2.push({id:"inventario",l:"Inventario Taller",icon:"🕐"});
  if(puedeVer(rol,"flota"))tabs2.push({id:"flota",l:"Flota / Leasing",icon:"🚐"});
  if(puedeVer(rol,"stock")||esRepuestos)tabs2.push({id:"stock",l:"Stock",icon:"📦"});

  const tabActivo=tab||tabs2[0]?.id;

  const counts={dashboard:"",flota:flota.length,recepciones:recepciones.length,programacion:esTecnico?programacion.filter(p=>p.tecnico===nombreTec).length:programacion.length,ordenes:esTecnico?ordenes.filter(o=>o.tecnico===nombreTec).length:ordenes.length,tecnicos:TECNICOS.length,inventario:recepciones.filter(r=>r.estado!=="Entregado").length,stock:stock.length};
  const sc={ok:{cls:"sp-ok",dot:"dok",msg:`Sync ${lastSync}`},saving:{cls:"sp-sv",dot:"dsv",msg:"Guardando..."},error:{cls:"sp-er",dot:"der",msg:"Sin conexión"},loading:{cls:"sp-sv",dot:"dsv",msg:"Cargando..."}}[sync]||{};

  return(<div>
    <div className="hdr">
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div className="lm">V</div>
        <div><div className="lt">Voltera</div><div className="ls">Taller EV</div></div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <div className={`sp ${sc.cls}`}><span className={`dot ${sc.dot}`}/>{sc.msg}</div>
        <Badge label={user.nombre} color="blue"/>
        <Badge label={rol} color={rol==="admin"?"purple":rol==="tecnico"?"amber":"gray"}/>
        <button onClick={onLogout} style={{fontSize:12,padding:"4px 10px",background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.2)",color:"#fff",borderRadius:7}}>Salir</button>
        {!esRepuestos&&!esTecnico&&<button className="be2 bsm" onClick={doExport} style={{fontSize:12}}>⬇ Excel</button>}
      </div>
    </div>
    <div className="sb">
      <div className="nsec">Menú</div>
      {tabs2.map(t=>(<div key={t.id} className={`ni${tabActivo===t.id?" active":""}`} onClick={()=>setTab(t.id)}>
        <span style={{fontSize:15}}>{t.icon}</span>{t.l}
        {counts[t.id]!==""&&counts[t.id]!==undefined&&<span className="nc">{counts[t.id]}</span>}
      </div>))}
      <div className="nsec" style={{marginTop:16}}>Estado</div>
      <div style={{padding:"4px 16px"}}>
        <div style={{fontSize:12,color:"#666",marginBottom:2}}>OTs en curso</div>
        <div style={{fontSize:20,fontWeight:700,color:"#0C2D6B"}}>{ordenes.filter(o=>o.estado==="Abierta"||o.estado==="En proceso").length}</div>
      </div>
      <div style={{padding:"4px 16px"}}>
        <div style={{fontSize:12,color:"#666",marginBottom:2}}>Alerta stock</div>
        <div style={{fontSize:20,fontWeight:700,color:stock.filter(s=>s.stock<=3).length>0?"#C62828":"#0C2D6B"}}>{stock.filter(s=>s.stock<=3).length}</div>
      </div>
    </div>
    <div className="main">
      {tabActivo==="dashboard"&&<Dashboard recepciones={recepciones} ordenes={ordenes} stock={stock}/>}
      {tabActivo==="recepciones"&&<Recepciones recepciones={recepciones} setRecepciones={setRecepciones} onExport={doExport}/>}
      {tabActivo==="programacion"&&<Programacion recepciones={recepciones} programacion={programacion} setProgramacion={setProgramacion} userTecnico={esTecnico?nombreTec:null}/>}
      {tabActivo==="ordenes"&&<OrdenesTrabajo recepciones={recepciones} stock={stock} setStock={setStock} ordenes={ordenes} setOrdenes={setOrdenes} onExport={doExport} userTecnico={esTecnico?nombreTec:null}/>}
      {tabActivo==="tecnicos"&&<Tecnicos ordenes={ordenes}/>}
      {tabActivo==="inventario"&&<InventarioTaller recepciones={recepciones}/>}
      {tabActivo==="flota"&&<FlotaLeasing flota={flota} setFlota={setFlota}/>}
      {tabActivo==="stock"&&<Stock stock={stock} setStock={setStock} onExport={doExport} rolRepuestos={esRepuestos}/>}
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
